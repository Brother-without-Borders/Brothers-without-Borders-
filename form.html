
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Application | Brothers Without Borders</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5f9;
    color: #17243b;
    line-height: 1.6;
}

header {
    background: #101f3d;
    color: white;
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h2 {
    color: #e6b94f;
}

header a {
    color: white;
    text-decoration: none;
}

.hero {
    background: linear-gradient(120deg, #101f3d, #243f68);
    color: white;
    text-align: center;
    padding: 55px 20px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.hero p {
    color: #e0e6f0;
}

.container {
    max-width: 850px;
    margin: 35px auto;
    padding: 0 18px;
}

.form-card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.07);
}

.form-card h2 {
    color: #14284b;
    margin-bottom: 20px;
    border-bottom: 2px solid #e6b94f;
    padding-bottom: 10px;
}

.form-group {
    margin-bottom: 19px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd3df;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #d6a83e;
}

textarea {
    resize: vertical;
    min-height: 110px;
}

.interests {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.interests label,
.agreement label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: normal;
}

.interests input,
.agreement input {
    width: auto;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    background: #d6a83e;
    color: #101f3d;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #edc45f;
}

#status {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

footer {
    text-align: center;
    background: #101f3d;
    color: white;
    padding: 22px;
    margin-top: 45px;
}

@media(max-width: 600px) {
    .form-card {
        padding: 20px;
    }

    .interests {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h2>BWB</h2>
    <a href="index.html">← Back to Home</a>
</header>

<section class="hero">
    <h1>Become a Member</h1>
    <p>Join Brothers Without Borders and become part of positive change.</p>
</section>

<div class="container">

<div class="form-card">

<h2>Membership Application Form</h2>

<form id="membershipForm">

<div class="form-group">
<label>Full Name *</label>
<input type="text" name="fullName" required
placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Date of Birth *</label>
<input type="date" name="dateOfBirth" required>
</div>

<div class="form-group">
<label>Gender *</label>
<select name="gender" required>
<option value="">Select gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select>
</div>

<div class="form-group">
<label>Phone Number *</label>
<input type="tel" name="phone" required
placeholder="Enter your phone number">
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" name="email"
placeholder="Enter your email address">
</div>

<div class="form-group">
<label>County / Location *</label>
<input type="text" name="location" required
placeholder="Enter your county or community">
</div>

<div class="form-group">
<label>Why do you want to join Brothers Without Borders? *</label>
<textarea name="reason" required
placeholder="Tell us why you want to become a member..."></textarea>
</div>

<div class="form-group">
<label>Areas of Interest</label>

<div class="interests">
<label><input type="checkbox" name="interests" value="Leadership"> Leadership</label>
<label><input type="checkbox" name="interests" value="Community Service"> Community Service</label>
<label><input type="checkbox" name="interests" value="Education"> Education</label>
<label><input type="checkbox" name="interests" value="Technology"> Technology</label>
<label><input type="checkbox" name="interests" value="Sports"> Sports</label>
<label><input type="checkbox" name="interests" value="Youth Empowerment"> Youth Empowerment</label>
<label><input type="checkbox" name="interests" value="Entrepreneurship"> Entrepreneurship</label>
</div>
</div>

<div class="form-group">
<label>How did you hear about BWB?</label>
<select name="source">
<option value="">Select an option</option>
<option>Facebook</option>
<option>WhatsApp</option>
<option>Friend or family</option>
<option>Community event</option>
<option>Other</option>
</select>
</div>

<div class="form-group agreement">
<label>
<input type="checkbox" name="agreement" required>
I confirm that the information provided is accurate.
</label>
</div>

<button type="submit" class="submit-btn">
Submit Membership Application
</button>

<p id="status"></p>

</form>
</div>
</div>

<footer>
<p>© 2026 Brothers Without Borders. All Rights Reserved.</p>
</footer>

<script>
const form = document.getElementById("membershipForm");
const statusMessage = document.getElementById("status");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const formData = new FormData(form);

    const application = {
        fullName: formData.get("fullName"),
        dateOfBirth: formData.get("dateOfBirth"),
        gender: formData.get("gender"),
        phone: formData.get("phone"),
        email: formData.get("email"),
        location: formData.get("location"),
        reason: formData.get("reason"),
        interests: formData.getAll("interests"),
        source: formData.get("source")
    };

    statusMessage.textContent = "Submitting your application...";

    try {
        const response = await fetch("/api/apply", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(application)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Application could not be submitted.");
        }

        statusMessage.textContent =
            "Your application has been submitted successfully!";

        form.reset();

    } catch (error) {
        statusMessage.textContent =
            error.message || "Something went wrong. Please try again.";
    }
});
</script>

</body>
</html>
